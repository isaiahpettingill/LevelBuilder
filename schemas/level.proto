syntax = "proto3";
package levelbuilder;
option csharp_namespace = "LevelBuilder.Core.Format";

// One project contains all maps and the types needed to interpret them.
message LevelDocument {
  uint32 format_version = 20;
  ProjectSettings project = 21;
  repeated Level levels = 22;
  repeated CachedAsset cached_assets = 23;
}
message ProjectSettings {
  uint32 schema_version = 1;
  string asset_directory = 2;
  string level_directory = 3;
  repeated AssetSource assets = 4;
  repeated string collider_types = 5;
  repeated string anchor_types = 6;
}
message AssetSource { string path = 1; string kind = 2; }
message CachedAsset {
  string path = 1;
  string kind = 2;
  uint32 frame_width = 3;
  uint32 frame_height = 4;
  bytes atlas_png = 5;
  repeated uint32 durations_ms = 6;
  repeated FrameTag tags = 7;
}
message FrameTag { string name = 1; uint32 from = 2; uint32 to = 3; uint32 direction = 4; }

message Level {
  uint32 format_version = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 tile_width = 5;
  uint32 tile_height = 6;
  repeated TileLayer visual_layers = 7;
  repeated ColliderCell colliders = 8;
  repeated SpriteObject sprites = 9;
  repeated EntityAnchor anchors = 10;
  repeated string tilesets = 11;
}
message TileLayer {
  string name = 1;
  bool visible = 2;
  bool locked = 3;
  repeated TileCell tiles = 4;
}
message TileCell {
  int32 x = 1;
  int32 y = 2;
  TileReference tile = 3;
}
message TileReference {
  string tileset = 1;
  oneof identity {
    TaggedVariant tagged = 2;
    uint32 unstable_frame = 3;
  }
}
message TaggedVariant { string tag = 1; uint32 variant = 2; }
message ColliderCell { int32 x = 1; int32 y = 2; uint32 property = 3; }
message SpriteObject {
  string id = 1;
  string asset = 2;
  float x = 3;
  float y = 4;
  string animation = 5;
  uint32 frame = 6;
  bool loop = 7;
  int32 draw_order = 8;
  bool flip_x = 9;
  bool flip_y = 10;
}
message EntityAnchor {
  string id = 1;
  string name = 2;
  uint32 type = 3;
  float x = 4;
  float y = 5;
}
