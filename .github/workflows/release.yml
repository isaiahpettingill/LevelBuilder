name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: dotnet build src/LevelBuilder.App/LevelBuilder.App.csproj --configuration Release -p:Version=${{ steps.version.outputs.value }}
      - name: Test
        run: dotnet test tests/LevelBuilder.Core.Tests/LevelBuilder.Core.Tests.csproj --configuration Release
      - name: Publish
        run: dotnet publish src/LevelBuilder.App/LevelBuilder.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:Version=${{ steps.version.outputs.value }} -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - name: Archive
        shell: bash
        run: |
          python -c "import os,zipfile; rid='${{ matrix.rid }}'; z=zipfile.ZipFile('LevelBuilder-'+rid+'.zip','w',zipfile.ZIP_DEFLATED); [(z.write(os.path.join('publish',f),f)) for f in os.listdir('publish') if os.path.isfile(os.path.join('publish',f))]; z.close()"
          python -c "import hashlib; p='LevelBuilder-${{ matrix.rid }}.zip'; open(p+'.sha256','w').write(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            LevelBuilder-${{ matrix.rid }}.zip
            LevelBuilder-${{ matrix.rid }}.zip.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
            scripts/install.sh
            scripts/install.ps1
