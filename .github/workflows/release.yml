name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux Native AOT tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/LevelBuilder.App/LevelBuilder.App.csproj | head -1)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: dotnet build src/LevelBuilder.App/LevelBuilder.App.csproj --configuration Release -p:Version=${{ steps.version.outputs.value }}
      - name: Test
        run: dotnet test tests/LevelBuilder.Core.Tests/LevelBuilder.Core.Tests.csproj --configuration Release
      - name: Publish
        run: dotnet publish src/LevelBuilder.App/LevelBuilder.App.csproj --configuration Release --runtime ${{ matrix.rid }} -p:Version=${{ steps.version.outputs.value }} --output publish
      - name: Verify native binary
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('publish/LevelBuilder.App${{ runner.os == 'Windows' && '.exe' || '' }}'); assert p.exists(); assert not any(Path('publish').glob('hostfxr*')), 'Managed runtime found'; print('Native executable:',p.stat().st_size,'bytes')"
      - name: Smoke test Linux desktop startup
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a timeout 15s publish/LevelBuilder.App --smoke-test
      - name: Remove symbol files from release package
        shell: bash
        run: find publish -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
      - name: Archive
        shell: bash
        run: |
          python -c "import os,zipfile; rid='${{ matrix.rid }}'; z=zipfile.ZipFile('LevelBuilder-'+rid+'.zip','w',zipfile.ZIP_DEFLATED); [(z.write(os.path.join('publish',f),f)) for f in os.listdir('publish') if os.path.isfile(os.path.join('publish',f))]; z.close()"
          python -c "import hashlib; p='LevelBuilder-${{ matrix.rid }}.zip'; open(p+'.sha256','w').write(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            LevelBuilder-${{ matrix.rid }}.zip
            LevelBuilder-${{ matrix.rid }}.zip.sha256
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Determine release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/LevelBuilder.App/LevelBuilder.App.csproj | head -1)"
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*
            scripts/install.sh
            scripts/install.ps1
